<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AL ALI Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09080f;--tx:#f2eefc;--mu:#a59fc0;--cd:#ffffff0d;--ln:#ffffff1a;--v:#8b5cf6;--p:#f472b6;--ok:#34d399}*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:0 14px 70px;max-width:760px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}.lg{font-weight:600}.lg small{color:var(--mu);font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}.b{border:0;cursor:pointer;font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;background:linear-gradient(90deg,var(--v),var(--p));color:#fff}.b.g{background:var(--cd);border:1px solid var(--ln)}.b.s{padding:6px 12px;font-size:12px}.b.r{background:#c0392b}
.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--ln);background:var(--cd);padding:9px 16px;border-radius:999px;font-size:13px;cursor:pointer}.tabs button.on{background:var(--tx);color:var(--bg);font-weight:600}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:12px 0}h3{font-size:15px;margin-bottom:12px}label{display:block;font-size:12px;color:var(--mu);margin:10px 0 5px}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);font-size:14px}select option{color:#000}input[type=color]{width:100%;height:42px;border:1px solid var(--ln);border-radius:12px;background:none;padding:3px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.st{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px}.st b{font-size:22px;display:block}.st span{font-size:12px;color:var(--mu)}
.rw{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}.rw>div{flex:1;min-width:0}.rw small{display:block;color:var(--mu);font-size:12px}.rw img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.sw{width:40px;height:24px;border-radius:99px;background:var(--ln);position:relative;cursor:pointer;flex:none;border:0}.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ok)}.sw.on i{left:19px}
.th{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.th button{border:1px solid var(--ln);border-radius:14px;padding:8px;cursor:pointer;background:var(--cd);font-size:12px}.th i{display:block;height:34px;border-radius:8px;margin-bottom:6px}
.pv{border-radius:16px;padding:14px;border:1px solid var(--ln);position:relative;overflow:hidden}.pv .o{position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:50%;opacity:.5;filter:blur(18px)}.pv h4{font-size:26px;font-weight:400;line-height:1.05;margin:16px 0 10px;position:relative}.pv .nv{display:flex;justify-content:space-between;font-size:12px;font-weight:600;position:relative}.pv .bt{display:inline-block;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;position:relative}
#ts{position:fixed;left:50%;bottom:20px;transform:translate(-50%,30px);opacity:0;transition:.3s;background:#1c1830;border:1px solid var(--ln);padding:12px 20px;border-radius:999px;font-size:13px;z-index:20}#ts.on{opacity:1;transform:translate(-50%,0)}#st{color:#fbbf24;font-size:13px;min-height:18px;margin:6px 0}
</style></head><body>
<header><div class="lg">AL ALI <small>· Admin</small></div><button class="b" id="sv" hidden>Save and publish</button></header><p id="st"></p>
<div id="lo" class="card"><label>Admin email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><div style="margin-top:14px"><button class="b" id="lg">Login</button></div></div>
<div id="app" hidden><div class="tabs" id="tb"></div><div id="v"></div><button class="b g" id="out" style="margin-top:14px">Logout</button></div><div id="ts"></div>
<script type="module">
import {firebaseConfig,cloudinary,adminEmail,defaults} from './config.js';
const $=id=>$.c[id]||($.c[id]=document.getElementById(id));$.c={};const val=id=>document.getElementById(id).value;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=t=>document.getElementById('st').textContent=t,ts=m=>{const o=document.getElementById('ts');o.textContent=m;o.classList.add('on');setTimeout(()=>o.classList.remove('on'),2200)};
const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),F=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
const app=(await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js')).initializeApp(firebaseConfig),au=A.getAuth(app),db=F.getFirestore(app);
const TH=[['Aurora','#8b5cf6','#f472b6','#07060d','#f2eefc'],['Aether','#3aa0ff','#67e8f9','#050d1c','#e8f1ff'],['Obsidian','#d4af37','#f5d77a','#0a0a0a','#f5efe0'],['Cream','#8b5a2b','#d9a066','#f6efe4','#2b1d12'],['Emerald','#2ee6a6','#7cf2c9','#04120d','#e6fff4'],['Rose','#e11d74','#fb7185','#fff1f5','#3b0a22']];
const PL=['Hero','Home grid','Category page only','Hidden'],SN={hero:'Hero',features:'Features',products:'Products',account:'Account banner',contact:'Contact'};
let S=JSON.parse(JSON.stringify(defaults)),prods=[],ords=[],tab='Dashboard',ed=null;const T=['Dashboard','Design','Layout','Products','Content','Accounts'];
const sw=(on,a)=>`<button class="sw ${on?'on':''}" data-a="${a}"><i></i></button>`,fl=(l,k,v,t='text')=>`<label>${l}</label><input type="${t}" data-k="${k}" value="${E(v)}">`,sel=(l,k,v,o)=>`<label>${l}</label><select data-k="${k}">${o.map(x=>`<option ${x==v?'selected':''}>${E(x)}</option>`).join('')}</select>`;
const pv=()=>`<div class="pv" id="pv" style="background:${S.c.bg};color:${S.c.tx}"><span class="o" style="background:${S.c.p}"></span><div class="nv"><span>${E(S.name)}</span><span style="color:${S.c.s}">Shop · Sign in</span></div><h4 style="font-family:${S.font=='Serif'?'Fraunces,serif;font-style:italic':'Inter,sans-serif'}">${E(S.head)}</h4><span class="bt" style="background:linear-gradient(90deg,${S.c.p},${S.c.s})">${E(S.btn)}</span></div>`;
const up=async f=>{const fd=new FormData();fd.append('file',f);fd.append('upload_preset',cloudinary.preset);const j=await(await fetch(`https://api.cloudinary.com/v1_1/${cloudinary.cloudName}/image/upload`,{method:'POST',body:fd})).json();if(!j.secure_url)throw 0;return j.secure_url};
const V={
Dashboard:()=>`<div class="g2" style="margin-top:12px"><div class="st"><b>${ords.length}</b><span>Orders</span></div><div class="st"><b>Rs. ${ords.reduce((a,o)=>a+Number(o.total||0),0).toLocaleString()}</b><span>Total sales</span></div><div class="st"><b>${prods.length}</b><span>Products</span></div><div class="st"><b>${ords.filter(o=>(o.status||'New')=='New').length}</b><span>New orders</span></div></div><div class="card"><h3>Orders</h3>${ords.map(o=>`<div class="rw"><div>${E(o.name)} · ${E(o.phone)}<small>${E(o.address)}<br>${E((o.items||[]).join(', '))} · Rs. ${E(o.total)}</small></div><select data-os="${o.id}" style="width:auto;padding:6px;font-size:12px">${['New','Packed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s==(o.status||'New')?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p style="color:var(--mu);font-size:14px">No orders yet.</p>'}</div>`,
Design:()=>`<div class="card"><h3>Live preview</h3>${pv()}</div><div class="card"><h3>Theme presets</h3><div class="th">${TH.map((t,i)=>`<button data-t="${i}"><i style="background:linear-gradient(90deg,${t[1]},${t[2]})"></i>${t[0]}</button>`).join('')}</div></div><div class="card"><h3>Custom colors</h3><div class="g2">${[['p','Primary'],['s','Secondary'],['bg','Background'],['tx','Text']].map(c=>`<div><label>${c[1]}</label><input type="color" data-c="${c[0]}" value="${S.c[c[0]]}"></div>`).join('')}</div>${sel('Headline font','font',S.font,['Serif','Sans'])}${sel('3D case material','mat',S.mat,['Glass','Matte','Chrome','Pearl'])}</div>`,
Layout:()=>`<div class="card"><h3>Page sections</h3>${S.order.map((o,i)=>`<div class="rw"><div>${SN[o[0]]||o[0]}</div><button class="b g s" data-u="${i}">↑</button><button class="b g s" data-d="${i}">↓</button>${sw(o[1],'o'+i)}</div>`).join('')}</div><div class="card"><h3>Product grid</h3>${sel('Products per row (phone)','cols',S.cols,[1,2])}<div class="rw"><div>Show featured product in hero</div>${sw(S.hero,'hero')}</div></div>`,
Products:()=>{const x=prods.find(p=>p.id==ed)||{};return `<div class="card"><h3>${ed?'Edit product':'Add product'}</h3>${fl('Name','',x.name||'').replace('data-k=""','id="nm"')}<div class="g2"><div><label>Price (Rs)</label><input id="pr" type="number" value="${x.price||''}"></div><div><label>Old price</label><input id="op" type="number" value="${x.oldPrice||''}"></div></div><label>Category</label><select id="ct">${S.cats.map(c=>`<option ${c==x.category?'selected':''}>${E(c)}</option>`).join('')}</select><label>Where it shows</label><select id="pl">${PL.map(c=>`<option ${c==(x.pl||'Home grid')?'selected':''}>${c}</option>`).join('')}</select><div class="g2"><div><label>Position (1 = first)</label><input id="ps" type="number" value="${x.pos||1}"></div><div><label>Tag</label><select id="tg">${['None','New','Hot','Sale','Best seller'].map(c=>`<option ${c==(x.tag||'None')?'selected':''}>${c}</option>`).join('')}</select></div></div><label>Photo ${x.image?'(choose a new one to replace)':''}</label><input id="im" type="file" accept="image/*"><div class="rw" style="border:0"><div>Out of stock</div>${sw(x.soldOut,'so')}</div><button class="b" data-a="sp">Save product</button> ${ed?'<button class="b g" data-a="cp">Cancel</button>':''}</div><div class="card"><h3>Products (${prods.length})</h3>${prods.map(p=>`<div class="rw">${p.image?`<img src="${E(p.image)}" alt="">`:''}<div>${E(p.name)}<small>Rs. ${E(p.price)} · ${E(p.pl||'Home grid')}</small></div><button class="b g s" data-e="${p.id}">Edit</button><button class="b r s" data-x="${p.id}">X</button></div>`).join('')||'<p style="color:var(--mu);font-size:14px">No products yet.</p>'}</div>`},
Content:()=>`<div class="card"><h3>Live preview</h3>${pv()}</div><div class="card"><h3>Text and brand</h3>${fl('Store name','name',S.name)}${fl('Headline','head',S.head)}${fl('Subtitle','sub',S.sub)}${fl('Hero button text','btn',S.btn)}${fl('Features heading','fh',S.fh)}</div><div class="card"><h3>Announcement, contact, delivery</h3>${fl('Top announcement bar (empty = hidden)','ann',S.ann)}${fl('WhatsApp number (923001234567)','wa',S.wa)}${fl('Delivery charges (Rs)','del',S.del,'number')}</div><div class="card"><h3>Categories</h3>${fl('Comma separated','cats',S.cats.join(', '))}</div>`,
Accounts:()=>`<div class="card"><h3>Customer accounts</h3><div class="rw"><div>Allow customer accounts<small>Sign up, login, order history</small></div>${sw(S.acc,'acc')}</div><div class="rw"><div>Require login to place an order</div>${sw(S.login,'login')}</div><div class="rw"><div>Sign in with Email</div>${sw(S.meth.Email,'mEmail')}</div><div class="rw"><div>Sign in with Google</div>${sw(S.meth.Google,'mGoogle')}</div></div>`};
const draw=()=>{document.getElementById('tb').innerHTML=T.map(t=>`<button class="${t==tab?'on':''}" data-tab="${t}">${t}</button>`).join('');document.getElementById('v').innerHTML=V[tab]()};
const rpv=()=>{const p=document.getElementById('pv');if(p)p.outerHTML=pv()};
async function load(){const[a,b,c]=await Promise.all([F.getDocs(F.collection(db,'products')),F.getDocs(F.collection(db,'orders')),F.getDoc(F.doc(db,'site','main'))]);
 prods=a.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.pos||0)-(y.pos||0));ords=b.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>y.at-x.at);
 if(c.exists()){const d=c.data();S={...S,...d,c:{...S.c,...d.c},meth:{...S.meth,...d.meth},order:d.order||S.order}}draw()}
const save=()=>F.setDoc(F.doc(db,'site','main'),S);
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-tab],[data-t],[data-u],[data-d],[data-a],[data-e],[data-x]');if(!t)return;const x=t.dataset;
 try{if(x.tab){tab=x.tab;ed=null}else if(x.t!==undefined){const h=TH[x.t];S.c={p:h[1],s:h[2],bg:h[3],tx:h[4]}}
 else if(x.u!==undefined){const i=+x.u;if(i>0)[S.order[i-1],S.order[i]]=[S.order[i],S.order[i-1]]}
 else if(x.d!==undefined){const i=+x.d;if(i<S.order.length-1)[S.order[i+1],S.order[i]]=[S.order[i],S.order[i+1]]}
 else if(x.e){ed=x.e}else if(x.x){if(!confirm('Delete this product?'))return;await F.deleteDoc(F.doc(db,'products',x.x));await load();return}
 else if(x.a){const a=x.a;if(a[0]=='o')S.order[+a.slice(1)][1]^=1;else if(a=='mEmail'||a=='mGoogle')S.meth[a.slice(1)]=!S.meth[a.slice(1)];else if(a=='so'){t.classList.toggle('on');return}
  else if(a=='cp')ed=null;
  else if(a=='sp'){const n=val('nm').trim(),pr=Number(val('pr'));if(!n||!pr)return msg('Name and price are required.');t.disabled=true;msg('Saving…');const f=document.getElementById('im').files[0],o0=prods.find(p=>p.id==ed)||{};
   const o={name:n,price:pr,oldPrice:Number(val('op'))||0,category:val('ct'),pl:val('pl'),pos:Number(val('ps'))||1,tag:val('tg')==='None'?'':val('tg'),soldOut:document.querySelector('[data-a=so]').classList.contains('on'),image:f?await up(f):(o0.image||'')};
   ed?await F.updateDoc(F.doc(db,'products',ed),o):await F.addDoc(F.collection(db,'products'),{...o,at:Date.now()});ed=null;await load();msg('');ts('Product saved');return}
  else S[a]=!S[a]}else return;draw()}catch(er){msg('Failed. Check photo, internet and Firestore rules.')}});
document.addEventListener('input',ev=>{const t=ev.target,x=t.dataset;if(x.k){S[x.k]=x.k=='cats'?t.value.split(',').map(s=>s.trim()).filter(Boolean):t.value;rpv()}if(x.c){S.c[x.c]=t.value;rpv()}});
document.addEventListener('change',async ev=>{const t=ev.target,x=t.dataset;if(x.os){await F.updateDoc(F.doc(db,'orders',x.os),{status:t.value});ts('Order updated')}else if(x.k=='font'||x.k=='mat'||x.k=='cols'){S[x.k]=x.k=='cols'?+t.value:t.value;rpv()}});
document.getElementById('sv').onclick=async()=>{try{await save();ts('Published to the live site')}catch(e){msg('Could not save. Check Firestore rules and admin email.')}};
document.getElementById('lg').onclick=()=>A.signInWithEmailAndPassword(au,val('em'),val('pw')).catch(e=>msg(e.code==='auth/invalid-credential'?'Wrong email or password (use the Firebase Users password).':'Login error: '+e.code));
document.getElementById('out').onclick=()=>A.signOut(au);
A.onAuthStateChanged(au,u=>{const ok=u&&u.email&&u.email.toLowerCase()===adminEmail.toLowerCase();if(u&&!ok){msg('This account is not the admin. Set adminEmail in config.js.');A.signOut(au);return}
 document.getElementById('lo').hidden=!!ok;document.getElementById('app').hidden=!ok;document.getElementById('sv').hidden=!ok;if(ok){msg('');load().catch(()=>msg('Could not load data. Check Firestore rules.'))}});
</script></body></html>
