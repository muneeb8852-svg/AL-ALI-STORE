<style>

*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;-webkit-font-smoothing:antialiased}

.ac{align-items:center;text-align:center}.ac .gl{padding:40px 24px;max-width:560px;width:100%}.ac .sub{margin-inline:auto}.ac .row{justify-content:center}

#bx .b{width:100%;text-align:center;margin-top:8px}#ms{color:var(--mu);font-size:13px;margin-top:10px;min-height:18px}
</style></head><body>
<canvas id="gl"></canvas><div class="orb" style="width:50vmax;height:50vmax;background:var(--v);top:-20vmax;left:-15vmax"></div><div class="orb" style="width:40vmax;height:40vmax;background:var(--p);bottom:-15vmax;right:-12vmax;opacity:.2"></div>
<div id="an"></div><nav><span class="lg" id="lg"></span><span class="nl"><a href="#shop">Shop</a><button class="b g" data-a="acct" id="si">Sign in</button><button class="b" data-a="cart" id="bg">Bag 0</button></span></nav>
<main id="mn"></main><footer id="ft"></footer><div id="md"><div id="bx"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">

 return `<section id="shop" class="sm"><p class="ey">The collection</p><h2>Pick your <em>sound.</em></h2><div class="tabs">${['All',...S.cats].map(c=>`<button class="${c===cat?'on':''}" data-cat="${e(c)}">${e(c)}</button>`).join('')}</div><div class="gr">${l.map(p=>`<div class="pc gl">${p.tag&&p.tag!=='None'?`<span class="tg">${e(p.tag)}</span>`:''}${img(p)}<h3>${e(p.name)}</h3><p>${money(p.price)}${p.oldPrice?`<s>${money(p.oldPrice)}</s>`:''}</p><button class="b" data-add="${p.id}" ${p.soldOut?'disabled':''}>${p.soldOut?'Out of stock':'Add to bag'}</button></div>`).join('')||'<p class="sub">No products here yet.</p>'}</div></section>`},

function draw(){const r=document.documentElement.style,c=S.c;r.setProperty('--v',c.p);r.setProperty('--p',c.s);r.setProperty('--bg',c.bg);r.setProperty('--tx',c.tx);r.setProperty('--cols',S.cols);r.setProperty('--hf',S.font==='Serif'?'Fraunces,serif':'Inter,sans-serif');r.setProperty('--hs',S.font==='Serif'?'italic':'normal');
 document.title=S.name;$('lg').textContent=S.name;$('an').textContent=S.ann;$('ft').textContent='© '+new Date().getFullYear()+' '+S.name;
 $('mn').innerHTML=S.order.filter(o=>o[1]&&SEC[o[0]]).map(o=>SEC[o[0]]()).join('');$('bg').textContent='Bag '+cart.length}

 show(`<h3>${e(user.displayName||user.email)}</h3>${h||'<p class="sub" style="margin:0 0 10px">No orders yet.</p>'}<button class="b g" data-a="out">Log out</button><button class="b g" data-a="close">Close</button>`)};
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-a],[data-add],[data-cat],[data-rm]');if(!t){if(ev.target.id==='md')hide();return}const d=t.dataset;
 if(d.cat){cat=d.cat;draw();return}if(d.add){cart.push(P.find(p=>p.id===d.add));draw();cartV();return}if(d.rm!==undefined){cart.splice(+d.rm,1);draw();cartV();return}
 const a=d.a;if(a==='cart')cartV();else if(a==='close')hide();else if(a==='acct')user?acctV():authV();
 else if(a==='out'){await A.signOut(au);hide()}
 else if(a==='google'){try{await A.signInWithPopup(au,new A.GoogleAuthProvider());hide()}catch(x){ms('Google sign-in did not work.')}}
 else if(a==='login'){try{await A.signInWithEmailAndPassword(au,$('em').value,$('pw').value);hide()}catch(x){ms('Wrong email or password.')}}
 else if(a==='signup'){try{const r=await A.createUserWithEmailAndPassword(au,$('em').value,$('pw').value);if($('nm').value)await A.updateProfile(r.user,{displayName:$('nm').value});await F.setDoc(F.doc(db,'customers',r.user.uid),{name:$('nm').value,email:$('em').value,at:Date.now()});hide()}catch(x){ms('Could not create account. Check email and password.')}}
 else if(a==='order'){if(S.login&&!user){authV();return}const n=$('n').value.trim(),p=$('p').value.trim(),ad=$('a').value.trim();if(!n||!p||!ad)return ms('Please fill in name, phone and address.');
  try{await F.addDoc(F.collection(db,'orders'),{name:n,phone:p,address:ad,items:cart.map(x=>x.name),total:cart.reduce((s,x)=>s+Number(x.price),0)+Number(S.del),uid:user?user.uid:'',status:'New',at:Date.now()});cart=[];draw();show('<h3>Order received</h3><p class="sub" style="margin:0 0 12px">Thank you! We will contact you shortly to confirm.</p><button class="b g" data-a="close">Close</button>')}catch(x){ms('Could not place the order. Please try again.')}}});
draw();
try{const T=THREE,cv=$('gl'),R=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=T.ACESFilmicToneMapping;R.outputEncoding=T.sRGBEncoding;
const sc=new T.Scene(),cam=new T.PerspectiveCamera(34,1,.1,60),es=new T.Scene();es.add(new T.Mesh(new T.SphereGeometry(10,16,16),new T.MeshBasicMaterial({color:0x140e28,side:T.BackSide})));
[[0xffffff,0,6,3],[S.c.s,-6,1,2],[S.c.p,6,0,2],[S.c.p,0,-5,3]].forEach(a=>{const m=new T.Mesh(new T.PlaneGeometry(7,3),new T.MeshBasicMaterial({color:new T.Color(a[0]).multiplyScalar(5),side:T.DoubleSide}));m.position.set(a[1],a[2],a[3]);m.lookAt(0,0,0);es.add(m)});

const dk=new T.MeshPhysicalMaterial({color:0x14122a,roughness:.2,metalness:.6,clearcoat:1,envMapIntensity:1.4}),wh=new T.MeshPhysicalMaterial({color:0xf6f4ff,roughness:.15,clearcoat:1,envMapIntensity:1.2}),cy=new T.MeshBasicMaterial({color:new T.Color(S.c.s)});
const M=new T.Group();sc.add(M);const base=new T.Mesh(blk(2.4,1.5,.5),dk);base.position.y=-.55;M.add(base);
const lid=new T.Group();lid.position.set(0,-.02,-.75);const lm=new T.Mesh(blk(2.4,1.5,.34),MT[S.mat]||MT.Glass);lm.position.z=.75;lid.add(lm);const st=new T.Mesh(new T.PlaneGeometry(1.2,.12),cy);st.rotation.x=-Math.PI/2;st.position.set(0,.2,.75);lid.add(st);M.add(lid);
for(const s of[-1,1]){const b=new T.Group();b.add(new T.Mesh(new T.SphereGeometry(.27,32,32),wh));const sm=new T.Mesh(new T.CylinderGeometry(.09,.08,.75,20),wh);sm.position.y=-.45;b.add(sm);b.position.set(s*.55,.45,.05);b.rotation.z=s*.1;M.add(b)}
const pt=[];for(let i=0;i<500;i++)pt.push((Math.random()-.5)*26,(Math.random()-.5)*16,(Math.random()-.5)*12-3);const pg=new T.BufferGeometry();pg.setAttribute('position',new T.Float32BufferAttribute(pt,3));const pts=new T.Points(pg,new T.PointsMaterial({color:new T.Color(S.c.tx),size:.05,transparent:true,opacity:.6}));sc.add(pts);
const K=[[1.6,0,.6,.35,1],[-1.6,.1,2.7,.2,1.1],[0,1.9,5.4,.45,.62]],MY=[-1.4,-1.9,1.6];let a=1,mx=0,my=0,p=0,cur=K[0].slice();
