<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AL ALI STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1535;--panel:#1a1f4a;--vio:#7c5cff;--org:#ff6b35;--paper:#f4f1ff}
*{box-sizing:border-box;margin:0}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--paper);overflow-x:hidden}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',sans-serif}
button{font:inherit;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#0f1535ea;backdrop-filter:blur(8px)}
.logo{font-size:21px;font-weight:800}.logo span{color:var(--org)}
.cartbtn{background:var(--org);color:#fff;font-weight:600;padding:9px 16px;border-radius:24px}
.hero{padding:34px 18px 0;text-align:center}
.hero h1{font-size:clamp(32px,9vw,60px);line-height:1.05;font-weight:800}
.hero p{max-width:440px;margin:12px auto 0;opacity:.75}
.stage{perspective:800px;height:250px;margin-top:10px}
.ring{position:relative;width:120px;height:140px;margin:46px auto 0;transform-style:preserve-3d;animation:spin 20s linear infinite}
.ring:hover{animation-play-state:paused}
.ring button{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;border-radius:18px;background:linear-gradient(150deg,var(--vio),#3b2ca8);color:#fff;font-weight:600;font-size:13px;box-shadow:0 10px 40px #7c5cff55}
.ring button i{font-style:normal;font-size:40px}
@keyframes spin{to{transform:rotateY(-360deg)}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}
.tabs button{white-space:nowrap;padding:9px 16px;border-radius:20px;background:var(--panel);color:var(--paper)}
.tabs button.on{background:var(--org);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:6px 16px 60px;perspective:900px}
.card{background:var(--panel);border-radius:18px;padding:10px;transform-style:preserve-3d;transition:transform .12s}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;transform:translateZ(28px);background:#0004}
.card h3{font-size:15px;margin:10px 0 2px;transform:translateZ(18px)}
.card small{opacity:.65;display:block;transform:translateZ(14px)}
.pr{color:var(--org);font-weight:800;margin-top:4px}
.card .add{margin-top:8px;width:100%;padding:9px;border-radius:12px;background:var(--vio);color:#fff;font-weight:600;transform:translateZ(24px)}
.empty{padding:30px;text-align:center;opacity:.7;grid-column:1/-1}
#cart{position:fixed;inset:0 0 0 auto;width:min(390px,100%);background:#0b1030;z-index:50;padding:18px;transform:translateX(100%);transition:transform .3s;overflow:auto}
#cart.open{transform:none}
#cart input,#cart textarea{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #fff3;background:#ffffff12;color:#fff;font:inherit}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;font-size:14px}
.row button{background:none;color:var(--org)}
.go{width:100%;padding:13px;margin-top:10px;border-radius:14px;background:var(--org);color:#fff;font-weight:700}
@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style></head><body>
<header><div class="logo">AL <span>ALI</span> STORE</div><button class="cartbtn" id="cb">🛒 Cart (0)</button></header>
<section class="hero"><h1>Earbuds, headphones aur adapters. Ghar tak, Cash on Delivery.</h1>
<p>Category par tap karein ya ring ko ghumte dekhein.</p>
<div class="stage"><div class="ring" id="ring"></div></div></section>
<div class="tabs" id="tabs"></div><div class="grid" id="grid"></div>
<aside id="cart"><div class="row"><h2>Aap ka cart</h2><button id="cx">✕</button></div><div id="items"></div>
<div id="tot"></div>
<input id="n" placeholder="Aap ka naam"><input id="p" type="tel" placeholder="Phone number"><textarea id="a" rows="3" placeholder="Poora address"></textarea>
<button class="go" id="ord">Order place karein</button><p id="msg" style="margin-top:10px"></p></aside>
<script type="module">
import {firebaseConfig,store,categories,demo} from './config.js';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ph=t=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#2a2f66"/><text x="150" y="170" font-size="90" text-anchor="middle">${t}</text></svg>`);
let products=[],cat='All',cart=[],db,fb;
if(!demo){fb=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
 const app=(await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js')).initializeApp(firebaseConfig);db=fb.getFirestore(app);
 const s=await fb.getDocs(fb.collection(db,'products'));products=s.docs.map(d=>({id:d.id,...d.data()}));}
else products=[{id:'1',name:'Grey Wireless Earbuds',price:900,category:'Bluetooth Earbuds',desc:'Bluetooth 5.0, 2 din battery'},{id:'2',name:'RGB Gaming Headset',price:2500,category:'Gaming Headphones',desc:'Mic ke saath'},{id:'3',name:'Type-C to AUX Adapter',price:350,category:'Adapters',desc:'Clear sound'}];
// 3D ring
const R=$('ring');categories.forEach((c,i)=>{const b=document.createElement('button');b.style.transform=`rotateY(${i*360/categories.length}deg) translateZ(190px)`;b.innerHTML=`<i>${c.icon}</i>${esc(c.name)}`;b.onclick=()=>{cat=c.name;draw();$('grid').scrollIntoView({behavior:'smooth'})};R.append(b)});
function draw(){
 $('tabs').innerHTML=['All',...categories.map(c=>c.name)].map(n=>`<button class="${n===cat?'on':''}" data-c="${esc(n)}">${esc(n)}</button>`).join('');
 const l=products.filter(p=>cat==='All'||p.category===cat);
 $('grid').innerHTML=l.length?l.map(p=>`<div class="card"><img src="${esc(p.image||ph('🎧'))}" alt="${esc(p.name)}"><h3>${esc(p.name)}</h3><small>${esc(p.desc)}</small><div class="pr">Rs.${esc(p.price)}</div><button class="add" data-id="${esc(p.id)}">Cart mein daalein</button></div>`).join(''):'<div class="empty">Is category mein abhi koi product nahi.</div>';
}
$('tabs').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;draw()}};
$('grid').onclick=e=>{const id=e.target.dataset.id;if(id){cart.push(products.find(p=>p.id===id));sync();$('cart').classList.add('open')}};
$('grid').onpointermove=e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.transform=`rotateY(${((e.clientX-r.left)/r.width-.5)*16}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*16}deg)`};
$('grid').onpointerleave=()=>document.querySelectorAll('.card').forEach(c=>c.style.transform='');
$('grid').addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});
function sync(){$('cb').textContent=`🛒 Cart (${cart.length})`;const s=cart.reduce((a,p)=>a+Number(p.price),0);
 $('items').innerHTML=cart.map((p,i)=>`<div class="row"><span>${esc(p.name)}</span><span>Rs.${esc(p.price)} <button data-i="${i}">hatayein</button></span></div>`).join('')||'<p style="opacity:.7">Cart khali he.</p>';
 $('tot').innerHTML=cart.length?`<div class="row"><span>Delivery</span><span>Rs.${store.delivery}</span></div><div class="row"><b>Total</b><b>Rs.${s+store.delivery}</b></div>`:''}
$('items').onclick=e=>{if(e.target.dataset.i){cart.splice(e.target.dataset.i,1);sync()}};
$('cb').onclick=()=>$('cart').classList.add('open');$('cx').onclick=()=>$('cart').classList.remove('open');
$('ord').onclick=async()=>{const n=$('n').value.trim(),p=$('p').value.trim(),a=$('a').value.trim();
 if(!cart.length||!n||!p||!a){$('msg').textContent='Cart mein product daalein aur naam, phone, address bharein.';return}
 const total=cart.reduce((x,y)=>x+Number(y.price),0)+store.delivery;
 try{if(!demo)await fb.addDoc(fb.collection(db,'orders'),{name:n,phone:p,address:a,items:cart.map(x=>x.name),total,at:Date.now()});
 $('msg').textContent='Order mil gaya! Hum jald aap se rabta karenge.';cart=[];sync()}catch(e){$('msg').textContent='Order nahi ho saka. Dobara koshish karein.'}};
draw();sync();
</script></body></html>
