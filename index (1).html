<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL ALI STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#2997ff;--bg:#000;--cd:#161618;--mu:#86868b}*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#f5f5f7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,a{font:inherit;border:0;cursor:pointer;text-decoration:none}
#an{background:#161618;color:#c7c7cc;text-align:center;font-size:12px;padding:8px 10px}#an:empty{display:none}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 20px;background:#000000b8;backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid #ffffff14}
.logo{font-weight:600;font-size:17px;letter-spacing:-.01em}.cb{background:none;color:#f5f5f7;font-size:14px;font-weight:500}
.hero{text-align:center;padding:56px 20px 0}.hero h1{font-size:clamp(34px,9vw,72px);font-weight:700;letter-spacing:-.035em;line-height:1.04;max-width:900px;margin:auto}
.hero p{color:var(--mu);font-size:clamp(16px,4vw,22px);margin:14px auto 0;max-width:560px;line-height:1.4}
.btns{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.pill{background:var(--ac);color:#fff;padding:12px 24px;border-radius:980px;font-weight:500;font-size:15px}.pill.o{background:none;color:var(--ac);border:1px solid var(--ac)}
.stage{position:relative;height:min(62vh,520px);min-height:340px;margin-top:10px}#c{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#ffffff14;border-block:1px solid #ffffff14;margin-top:24px}
.strip div{background:#000;padding:20px 12px;text-align:center;font-size:13px;color:var(--mu)}.strip b{display:block;color:#f5f5f7;font-size:15px;font-weight:600;margin-bottom:3px}
.sec{max-width:1100px;margin:auto;padding:72px 20px 0}.sec h2{font-size:clamp(28px,6vw,44px);font-weight:700;letter-spacing:-.03em}.sec .s{color:var(--mu);margin-top:6px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:24px}
.cat{background:var(--cd);border-radius:22px;padding:22px 16px;color:#f5f5f7;text-align:left;transition:transform .25s,background .25s}.cat:hover{transform:translateY(-4px);background:#1f1f22}
.cat i{font-style:normal;font-size:34px;display:block;margin-bottom:26px}.cat b{font-weight:600;font-size:16px;display:block}.cat span{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:26px;scrollbar-width:none}.tabs button{white-space:nowrap;padding:9px 18px;border-radius:980px;background:var(--cd);color:#c7c7cc;font-size:14px}.tabs button.on{background:#f5f5f7;color:#000;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:20px}
.card{position:relative;background:var(--cd);border-radius:24px;padding:12px 12px 18px;transition:transform .3s}.card:hover{transform:translateY(-5px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:#222}.card h3{font-size:16px;font-weight:600;margin:14px 6px 2px;letter-spacing:-.01em}.card small{color:var(--mu);display:block;margin:0 6px;font-size:13px;min-height:18px}
.pr{margin:10px 6px 12px;font-weight:600}.pr s{color:var(--mu);font-weight:400;font-size:13px;margin-left:8px}
.tg{position:absolute;top:22px;left:22px;background:#000000b0;backdrop-filter:blur(8px);color:#f5f5f7;font-size:11px;font-weight:600;padding:4px 10px;border-radius:980px}
.add{margin:0 6px;width:calc(100% - 12px);padding:11px;border-radius:980px;background:var(--ac);color:#fff;font-weight:500;font-size:14px}.add:disabled{background:#2c2c2e;color:#6e6e73}
.empty{padding:40px;text-align:center;color:var(--mu);grid-column:1/-1}
footer{margin-top:90px;border-top:1px solid #ffffff14;padding:32px 20px 60px;text-align:center;color:var(--mu);font-size:13px}
#cart{position:fixed;inset:0 0 0 auto;width:min(400px,100%);background:#0b0b0c;z-index:50;padding:22px;transform:translateX(100%);transition:transform .35s;overflow:auto;border-left:1px solid #ffffff14}#cart.open{transform:none}
#cart h2{font-size:22px;letter-spacing:-.02em}#cart input,#cart textarea{width:100%;padding:13px;margin:5px 0;border-radius:12px;border:1px solid #ffffff1f;background:#161618;color:#fff;font:inherit}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;font-size:14px}.row button{background:none;color:var(--ac)}
.go{width:100%;padding:14px;margin-top:12px;border-radius:980px;background:var(--ac);color:#fff;font-weight:600}
#wa{position:fixed;right:16px;bottom:16px;z-index:20;background:#25d366;color:#fff;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:24px}
</style></head><body>
<div id="an"></div>
<header><div class="logo" id="lg">AL ALI STORE</div><button class="cb" id="cb">Cart (0)</button></header>
<section class="hero"><h1 id="h1"></h1><p id="h2"></p><div class="btns"><a class="pill" href="#shop">Abhi kharidein</a><a class="pill o" href="#cats">Categories dekhein</a></div>
<div class="stage"><canvas id="c"></canvas></div></section>
<div class="strip"><div><b>Cash on Delivery</b>Ghar par payment</div><div><b>Poore Pakistan</b>Delivery service</div><div><b>Asaan order</b>Sirf 3 steps</div><div><b>WhatsApp support</b>Madad ke liye</div></div>
<section class="sec" id="cats"><h2>Category chunein.</h2><p class="s">Aap ko jo chahiye, wahi dhoondein.</p><div class="cats" id="ct"></div></section>
<section class="sec" id="shop"><h2>Saare products.</h2><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></section>
<footer><div id="ft"></div></footer><a id="wa" hidden>💬</a>
<aside id="cart"><div class="row"><h2>Aap ka cart</h2><button id="cx">✕</button></div><div id="items"></div><div id="tot"></div>
<input id="n" placeholder="Aap ka naam"><input id="p" type="tel" placeholder="Phone number"><textarea id="a" rows="3" placeholder="Poora address"></textarea>
<button class="go" id="ord">Order place karein</button><p id="msg" style="margin-top:12px;color:#c7c7cc"></p></aside>
<script type="module">
import {firebaseConfig,demo,defaults} from './config.js';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={...defaults},products=[],cat='All',cart=[],db,fb;
if(!demo){try{fb=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
 const app=(await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js')).initializeApp(firebaseConfig);db=fb.getFirestore(app);
 const [ss,ps]=await Promise.all([fb.getDoc(fb.doc(db,'site','main')).catch(()=>null),fb.getDocs(fb.collection(db,'products'))]);
 if(ss&&ss.exists())S={...defaults,...ss.data()};products=ps.docs.map(d=>({id:d.id,...d.data()}));}catch(e){console.error(e)}}
else products=[{id:'1',name:'Grey Wireless Earbuds',price:900,oldPrice:1200,tag:'New',category:'Bluetooth Earbuds',desc:'Bluetooth 5.0, 2 din battery'},{id:'2',name:'RGB Gaming Headset',price:2500,tag:'Hot',category:'Gaming Headphones',desc:'Mic ke saath'},{id:'3',name:'Type-C to AUX Adapter',price:350,category:'Adapters',desc:'Clear sound'}];
document.documentElement.style.setProperty('--ac',S.accent);document.title=S.name;
$('lg').textContent=S.name;$('an').textContent=S.announce;$('h1').textContent=S.heroTitle;$('h2').textContent=S.heroSub;$('ft').textContent='© '+new Date().getFullYear()+' '+S.name+'. Tamam haqooq mehfooz.';
if(S.whatsapp){$('wa').hidden=false;$('wa').href='https://wa.me/'+S.whatsapp.replace(/\D/g,'')}
const cats=S.categories,go=n=>{cat=n;draw();$('shop').scrollIntoView()};
$('ct').innerHTML=cats.map(c=>`<button class="cat" data-c="${esc(c.name)}"><i>${esc(c.icon)}</i><b>${esc(c.name)}</b><span>${products.filter(p=>p.category===c.name).length} products</span></button>`).join('');
$('ct').onclick=e=>{const b=e.target.closest('.cat');if(b)go(b.dataset.c)};
const ph='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#1c1c1f"/><text x="150" y="175" font-size="90" text-anchor="middle">🎧</text></svg>');
function draw(){
 $('tabs').innerHTML=['All',...cats.map(c=>c.name)].map(n=>`<button class="${n===cat?'on':''}" data-c="${esc(n)}">${esc(n)}</button>`).join('');
 const l=products.filter(p=>cat==='All'||p.category===cat);
 $('grid').innerHTML=l.length?l.map(p=>`<div class="card">${p.tag?`<span class="tg">${esc(p.tag)}</span>`:''}<img src="${esc(p.image||ph)}" alt="${esc(p.name)}" loading="lazy"><h3>${esc(p.name)}</h3><small>${esc(p.desc)}</small><div class="pr">Rs. ${esc(p.price)}${p.oldPrice?`<s>Rs. ${esc(p.oldPrice)}</s>`:''}</div><button class="add" data-id="${esc(p.id)}" ${p.soldOut?'disabled':''}>${p.soldOut?'Stock khatam':'Cart mein daalein'}</button></div>`).join(''):'<div class="empty">Is category mein abhi koi product nahi.</div>';
}
$('tabs').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;draw()}};
$('grid').onclick=e=>{const id=e.target.dataset.id;if(id){cart.push(products.find(p=>p.id===id));sync();$('cart').classList.add('open')}};
function sync(){$('cb').textContent=`Cart (${cart.length})`;const s=cart.reduce((a,p)=>a+Number(p.price),0);
 $('items').innerHTML=cart.map((p,i)=>`<div class="row"><span>${esc(p.name)}</span><span>Rs. ${esc(p.price)} <button data-i="${i}">hatayein</button></span></div>`).join('')||'<p style="color:#86868b">Cart khali he.</p>';
 $('tot').innerHTML=cart.length?`<div class="row"><span>Delivery</span><span>Rs. ${S.delivery}</span></div><div class="row"><b>Total</b><b>Rs. ${s+Number(S.delivery)}</b></div>`:''}
$('items').onclick=e=>{if(e.target.dataset.i){cart.splice(e.target.dataset.i,1);sync()}};
$('cb').onclick=()=>$('cart').classList.add('open');$('cx').onclick=()=>$('cart').classList.remove('open');
$('ord').onclick=async()=>{const n=$('n').value.trim(),p=$('p').value.trim(),a=$('a').value.trim();
 if(!cart.length||!n||!p||!a){$('msg').textContent='Cart mein product daalein aur naam, phone, address bharein.';return}
 const total=cart.reduce((x,y)=>x+Number(y.price),0)+Number(S.delivery);
 try{if(!demo)await fb.addDoc(fb.collection(db,'orders'),{name:n,phone:p,address:a,items:cart.map(x=>x.name),total,at:Date.now()});
 $('msg').textContent='Order mil gaya! Hum jald aap se rabta karenge.';cart=[];sync()}catch(e){$('msg').textContent='Order nahi ho saka. Dobara koshish karein.'}};
draw();sync();
// ---- 3D hero: 3 floating photo panels ----
try{const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
const cv=$('c'),box=cv.parentElement,r=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new T.Scene(),cam=new T.PerspectiveCamera(40,1,.1,100);
const mk=(p,i)=>{const c=document.createElement('canvas');c.width=640;c.height=800;const x=c.getContext('2d'),t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=4;
 const paint=im=>{x.save();x.beginPath();x.roundRect?x.roundRect(0,0,640,800,56):x.rect(0,0,640,800);x.clip();const g=x.createLinearGradient(0,0,0,800);g.addColorStop(0,'#2a2a2e');g.addColorStop(1,'#121214');x.fillStyle=g;x.fillRect(0,0,640,800);
  if(im){const s=Math.max(640/im.width,800/im.height);x.drawImage(im,(640-im.width*s)/2,(800-im.height*s)/2,im.width*s,im.height*s)}else{x.font='200px serif';x.textAlign='center';x.fillText(['🎧','🎮','⌚'][i],320,400)}
  const f=x.createLinearGradient(0,540,0,800);f.addColorStop(0,'#0000');f.addColorStop(1,'#000c');x.fillStyle=f;x.fillRect(0,540,640,260);
  x.fillStyle='#f5f5f7';x.font='600 42px Inter,sans-serif';x.textAlign='left';x.fillText(p.title||'',44,744);x.restore();
  x.strokeStyle='#ffffff26';x.lineWidth=2;x.beginPath();x.roundRect?x.roundRect(1,1,638,798,55):x.rect(1,1,638,798);x.stroke();t.needsUpdate=true};
 paint();if(p.image){const im=new Image();im.crossOrigin='anonymous';im.onload=()=>paint(im);im.src=p.image}return t};
const root=new T.Group();sc.add(root);const faces=[],pos=[[-1,-.1,-.4,.42],[0,.15,.6,0],[1,-.1,-.4,-.42]];
S.panels.slice(0,3).forEach((p,i)=>{const g=new T.Group();
 const glow=new T.Mesh(new T.PlaneGeometry(3.4,4.2),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.05,depthWrite:false}));glow.position.z=-.08;
 const fc=new T.Mesh(new T.PlaneGeometry(2.1,2.625),new T.MeshBasicMaterial({map:mk(p,i),transparent:true,toneMapped:false}));fc.userData.cat=p.cat;faces.push(fc);
 g.add(glow,fc);g.userData={x:pos[i][0],y:pos[i][1],z:pos[i][2],ry:pos[i][3],i};root.add(g)});
let mx=0,my=0,sx=2.5;const rc=new T.Raycaster(),m2=new T.Vector2();
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function size(){const w=box.clientWidth,h=box.clientHeight,a=w/h;r.setSize(w,h,false);cam.aspect=a;sx=a<.9?1.5:2.5;cam.position.z=Math.max(9,(sx+1.5)/(.364*a));cam.updateProjectionMatrix()}size();addEventListener('resize',size);
cv.addEventListener('click',e=>{const b=cv.getBoundingClientRect();m2.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);rc.setFromCamera(m2,cam);const h=rc.intersectObjects(faces)[0];if(h)go(h.object.userData.cat||'All')});
const red=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(t){t*=.001;root.rotation.y+=(mx*.35-root.rotation.y)*.05;root.rotation.x+=(my*.12-root.rotation.x)*.05;
 root.children.forEach(g=>{const u=g.userData;g.position.set(u.x*sx,u.y+Math.sin(t*.9+u.i*2)*.14,u.z);g.rotation.y=u.ry+Math.sin(t*.5+u.i)*.05});
 r.render(sc,cam);if(!red)requestAnimationFrame(loop)}
requestAnimationFrame(loop);}catch(e){console.error('3D load nahi hua',e)}
</script></body></html>
